[project]
name = "invenio-iiif"
description = "IIIF API for Invenio."
readme = "README.rst"
license = "MIT"
authors = [
  { name = "CERN", email = "info@inveniosoftware.org" },
]
keywords = [
  "IIIF",
  "invenio",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 2",
  "Programming Language :: Python :: 2.7",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.5",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "flask-iiif>=0.6.1",
  "invenio-access>=1.4.2",
  "invenio-base>=1.2.5",
  "invenio-celery>=1.2.3",
  "invenio-files-rest>=1.3.0",
  "invenio-records-files>=1.0.0",
  "wand>=0.4.4",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/inveniosoftware/invenio-iiif"

[project.entry-points."invenio_base.api_apps"]
invenio_iiif = "invenio_iiif:InvenioIIIFAPI"

[project.entry-points."invenio_base.apps"]
invenio_iiif = "invenio_iiif:InvenioIIIF"

[project.entry-points."invenio_base.blueprints"]
invenio_iiif = "invenio_iiif.previewer:blueprint"

[project.entry-points."invenio_celery.tasks"]
invenio_iiif = "invenio_iiif.tasks"

[project.entry-points."invenio_previewer.previewers"]
iiif_image = "invenio_iiif.previewer"

[project.optional-dependencies]
docs = [
  "sphinx>=3.3.1,<3.4",
]
tests = [
  "invenio-db[versioning,postgresql]>=1.0.9",
  "pytest-invenio>=1.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "invenio_iiif/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/invenio_iiif",
]

[tool.isort]
profile = "black"

[tool.pydocstyle]
add_ignore = "D401"

[tool.pytest.ini_options]
addopts = '--black --isort --pydocstyle --doctest-glob="*.rst" --doctest-modules --cov=invenio_iiif --cov-report=term-missing'
testpaths = "tests invenio_iiif"
live_server_scope = "module"
